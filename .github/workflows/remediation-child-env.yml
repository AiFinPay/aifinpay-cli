name: CLI child environment remediation

on:
  push:
    branches:
      - security/audit-2026-08-06-remediation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/audit-2026-08-06-remediation
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Replace full parent environment inheritance with allowlist
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.go')
          s = p.read_text()
          old = '''\tcmd := exec.CommandContext(ctx, parts[0], parts[1:]...)\n\tcmd.Env = os.Environ() // pass AIFINPAY_AGENT_SECRET / BASE_URL / MAX_USD through\n\t// Inject the keystore identity so every command drives the SAME wallet.\n\t// Without this the MCP server mints a fresh agent per invocation, so\n\t// `address` and `call` would disagree. An explicit env var still wins.\n\tif os.Getenv(envSecret) == "" {\n\t\tif secret := loadKeystoreSecret(); secret != "" {\n\t\t\tcmd.Env = append(cmd.Env, envSecret+"="+secret)\n\t\t}\n\t}\n'''
          new = '''\tcmd := exec.CommandContext(ctx, parts[0], parts[1:]...)\n\t// Do not inherit the full parent environment. Cloud credentials, database\n\t// URLs, keystore passphrases and unrelated API keys must never be exposed to\n\t// npm/the MCP child. mcpChildEnv keeps only execution/proxy state plus the\n\t// explicit AiFinPay runtime policy variables.\n\tcmd.Env = mcpChildEnv()\n\t// The audited MCP process itself needs the agent signing secret. Pass exactly\n\t// that one credential after the environment has been filtered; the default\n\t// command is version-pinned and npm lifecycle scripts are disabled.\n\tsecret := os.Getenv(envSecret)\n\tif secret == "" {\n\t\tsecret = loadKeystoreSecret()\n\t}\n\tif secret != "" {\n\t\tcmd.Env = append(cmd.Env, envSecret+"="+secret)\n\t}\n'''
          if old not in s:
              raise SystemExit('MCP child environment block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Assert unsafe inheritance is absent
        run: |
          ! grep -n 'cmd.Env = os.Environ' main.go
          grep -n 'cmd.Env = mcpChildEnv()' main.go
      - name: Go quality gate
        run: |
          gofmt -w main.go security_runtime.go security_runtime_test.go
          git diff --exit-code -- '*.go' || true
          go vet ./...
          go test -race ./...
          go build ./...
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.go security_runtime.go security_runtime_test.go
          if git diff --cached --quiet; then
            echo "Child environment remediation already applied"
            exit 0
          fi
          git commit -m "security: filter parent secrets before launching MCP"
          git push origin HEAD:security/audit-2026-08-06-remediation
